<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelancer AutoBid Dashboard</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; font-size: 14px; line-height: 1.5; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--card-border); margin-bottom: 24px; }
    .logo { font-size: 20px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .header-actions { display: flex; gap: 12px; align-items: center; }
    .btn { padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; font-size: 13px; transition: 0.2s; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #1f2937; color: var(--text); border: 1px solid #374151; }
    .btn-secondary:hover { background: #374151; }
    
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 18px; border-radius: 10px; }
    .stat-label { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .stat-val { font-size: 28px; font-weight: 700; }

    .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--card-border); padding-bottom: 8px; }
    .tab { padding: 8px 16px; background: transparent; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; border-radius: 6px; }
    .tab.active { background: #1f2937; color: #38bdf8; }

    .feed-container { display: flex; flex-direction: column; gap: 12px; }
    .project-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 16px; }
    .project-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .project-title { font-size: 16px; font-weight: 600; color: #f3f4f6; }
    .badge { padding: 3px 8px; border-radius: 9999px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .badge-bid { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid #10b981; }
    .badge-skipped { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; }
    .badge-pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid #f59e0b; }
    .meta-row { display: flex; gap: 16px; color: var(--text-muted); font-size: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    .proposal-box { background: #0d1322; border-left: 3px solid var(--accent); padding: 12px; border-radius: 4px; margin-top: 10px; font-size: 13px; color: #cbd5e1; }
    .reason-box { background: rgba(239, 68, 68, 0.08); border-left: 3px solid var(--danger); padding: 8px 12px; border-radius: 4px; margin-top: 8px; font-size: 12px; color: #fca5a5; }

    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: #e5e7eb; }
    .form-input, .form-textarea { width: 100%; background: #1f2937; border: 1px solid #374151; color: white; padding: 10px; border-radius: 6px; font-size: 13px; }
    .form-textarea { height: 90px; resize: vertical; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <span>⚡ FreelancerAutoBid Local Hub</span>
      </div>
      <div class="header-actions">
        <button id="pollNowBtn" class="btn btn-secondary">⚡ Poll Now</button>
        <button id="saveConfigBtn" class="btn btn-primary">Save Settings</button>
      </div>
    </header>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Scanned</div>
        <div id="statScanned" class="stat-val">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Qualified Projects</div>
        <div id="statQualified" class="stat-val" style="color: #38bdf8;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Bids Submitted</div>
        <div id="statBids" class="stat-val" style="color: #34d399;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Skipped (Filters)</div>
        <div id="statSkipped" class="stat-val" style="color: #f87171;">0</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="feed">Live Projects Feed</button>
      <button class="tab" data-tab="bids">Bids & Proposals Log</button>
      <button class="tab" data-tab="settings">Filter Rules & AI Prompts</button>
    </div>

    <div id="tab-feed" class="tab-content">
      <div id="projectsList" class="feed-container">
        <!-- Injected dynamically by app.js -->
      </div>
    </div>

    <div id="tab-bids" class="tab-content" style="display: none;">
      <div id="bidsList" class="feed-container">
        <!-- Injected dynamically by app.js -->
      </div>
    </div>

    <div id="tab-settings" class="tab-content" style="display: none;">
      <div class="stat-card">
        <h3 style="margin-bottom: 16px;">Qualification & Bidding Configuration</h3>
        <div class="form-group">
          <label class="form-label">Mandatory Platform Tech Tags (Comma-separated)</label>
          <input type="text" id="mandatorySkillsInput" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Negative Keyword Blacklist (Comma-separated)</label>
          <input type="text" id="negativeKeywordsInput" class="form-input">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label">Minimum Budget ($)</label>
            <input type="number" id="minBudgetInput" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Maximum Budget ($)</label>
            <input type="number" id="maxBudgetInput" class="form-input">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">AI Proposal Prompt Engineering Template</label>
          <textarea id="systemPromptInput" class="form-textarea"></textarea>
        </div>
        <button id="saveConfigBtn2" class="btn btn-primary">Save Configuration</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
